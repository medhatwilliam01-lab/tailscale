```yaml
name: Secure RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Validate Windows and Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $IsWindows) {
            throw "This workflow requires Windows."
          }

          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $ts)) {
            throw "Tailscale is not installed."
          }

          $statusJson = & $ts status --json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query Tailscale status."
          }

          $status = $statusJson | ConvertFrom-Json

          if ($status.BackendState -ne 'Running') {
            throw "Tailscale is not connected."
          }

          $ips = @(& $ts ip -4)
          if ($LASTEXITCODE -ne 0 -or $ips.Count -eq 0) {
            throw "Could not obtain the Tailscale IPv4 address."
          }

          "Tailscale IPv4: $($ips -join ', ')" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Configure secure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpPath = "$rdpPath\WinStations\RDP-Tcp"

          # Enable RDP and require Network Level Authentication.
          Set-ItemProperty -Path $rdpPath `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty -Path $tcpPath `
            -Name UserAuthentication -Value 1

          # Require TLS security layer.
          Set-ItemProperty -Path $tcpPath `
            -Name SecurityLayer -Value 2

          # Remove the old rule created by the original workflow.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Recreate a restricted inbound rule.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale-Only' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale-Only' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          if ((Get-Service TermService).Status -ne 'Running') {
            throw "Remote Desktop service failed to start."
          }

          "RDP enabled; NLA and TLS required." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Verify configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $tcpPath = "$rdpPath\WinStations\RDP-Tcp"

          $deny = (Get-ItemProperty $rdpPath).fDenyTSConnections
          $nla = (Get-ItemProperty $tcpPath).UserAuthentication
          $tls = (Get-ItemProperty $tcpPath).SecurityLayer

          if ($deny -ne 0) {
            throw "RDP is disabled."
          }

          if ($nla -ne 1) {
            throw "NLA verification failed."
          }

          if ($tls -ne 2) {
            throw "TLS security layer verification failed."
          }

          $rule = Get-NetFirewallRule `
            -DisplayName 'RDP-Tailscale-Only' `
            -ErrorAction Stop

          if ($rule.Enabled -ne 'True' -or
              $rule.Direction -ne 'Inbound' -or
              $rule.Action -ne 'Allow') {
            throw "RDP firewall rule verification failed."
          }

          Write-Host "SUCCESS: RDP, NLA, and TLS settings verified."
          Write-Host "SUCCESS: Restricted Tailscale firewall rule exists."
```
