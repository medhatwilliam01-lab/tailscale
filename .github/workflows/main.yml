```yaml
name: Secure RDP via Tailscale (Automated Loop)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-diagnostics
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Validate Configuration
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "Missing repository secret: TAILSCALE_AUTH_KEY"
          }

          Write-Host "Windows runner is ready."
          Write-Host "Tailscale secret is configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

          try {
              Invoke-WebRequest -Uri $url -OutFile $msi

              $proc = Start-Process `
                  -FilePath 'msiexec.exe' `
                  -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') `
                  -Wait -PassThru

              if ($proc.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale MSI installation failed: $($proc.ExitCode)"
              }

              Write-Host "Tailscale installation completed."
          }
          finally {
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $exe)) {
              throw "Tailscale executable not found: $exe"
          }

          $hostname = "gh-diagnostic-${{ github.run_id }}"

          & $exe up "--authkey=$env:TS_AUTH_KEY" "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed: exit code $LASTEXITCODE"
          }

          $ip = & $exe ip -4

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace(($ip -join ''))) {
              throw "Unable to retrieve the Tailscale IPv4 address."
          }

          Write-Host "Tailscale connection verified."
          Write-Host "Tailscale IPv4: $($ip -join ', ')"
```
