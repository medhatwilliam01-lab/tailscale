
name: Secure RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Required Secrets
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Missing GitHub secret: TAILSCALE_AUTH_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub secret: RDP_PASSWORD"
          }

          Write-Host "Required secrets validated."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpBase = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp = Join-Path $rdpBase 'WinStations\RDP-Tcp'

          # Enable RDP and keep NLA enabled.
          Set-ItemProperty -Path $rdpBase `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty -Path $rdpTcp `
            -Name 'UserAuthentication' -Value 1

          # Create or update the local RDP account.
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name 'RDP' `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser -Name 'RDP' -Password $securePassword
            Enable-LocalUser -Name 'RDP'
          }

          $userSid = (Get-LocalUser -Name 'RDP').SID.Value

          $members = @(
            Get-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -ErrorAction SilentlyContinue
          )

          $isMember = $members | Where-Object {
            $_.SID -and $_.SID.Value -eq $userSid
          }

          if (-not $isMember) {
            Add-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -Member 'RDP'
          }

          # Disable default RDP firewall rules.
          $defaultRules = Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          if ($defaultRules) {
            $defaultRules | Disable-NetFirewallRule
          }

          # Replace the Tailscale-specific firewall rule.
          $oldRule = Get-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue

          if ($oldRule) {
            $oldRule | Remove-NetFirewallRule
          }

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          Restart-Service -Name 'TermService' -Force

          Write-Host "RDP configuration completed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://dl.tailscale.com/stable/tailscale-setup-1.104.1-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          try {
            Invoke-WebRequest `
              -Uri $url `
              -OutFile $installer

            if (-not (Test-Path -LiteralPath $installer)) {
              throw "Tailscale installer download failed."
            }

            $process = Start-Process `
              -FilePath 'msiexec.exe' `
              -ArgumentList "/i `"$installer`" /qn /norestart" `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }

            Write-Host "Tailscale installed successfully."
          }
          finally {
            Remove-Item -LiteralPath $installer `
              -Force -ErrorAction SilentlyContinue
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tailscaleExe = Join-Path `
            $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path -LiteralPath $tailscaleExe)) {
            throw "tailscale.exe was not found."
          }

          & $tailscaleExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            --unattended `
            --timeout=2m

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $result = & $tailscaleExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $result) {
              $candidate = [string](
                $result | Select-Object -First 1
              )

              $candidate = $candidate.Trim()

              if ($candidate -match '^100\.') {
                $tsIP = $candidate
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IPv4: $tsIP"

      - name: Verify RDP Listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listener = $null

          for ($i = 0; $i -lt 30; $i++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $listener) {
            Get-Service -Name 'TermService' |
              Format-Table Name, Status

            throw "RDP is not listening on port 3389."
          }

          Write-Host "RDP listener is active."
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "===== RDP ACCESS ====="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: use GitHub secret RDP_PASSWORD"
          Write-Host "======================"

          while ($true) {
            Write-Host "[$(Get-Date -Format o)] RDP runner active."
            Start-Sleep -Seconds 300
          }
