name: Secure RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10

    steps:
      - name: Validate Windows Runner and Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $IsWindows) {
            throw "This workflow requires Windows."
          }

          # Verify administrative privileges.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)

          if (-not $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "The runner must run with Windows administrator privileges."
          }

          # Find Tailscale.
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $ts)) {
            throw "Tailscale is not installed on this Windows machine."
          }

          # Verify Tailscale connection.
          $statusJson = (& $ts status --json 2>$null) -join "`n"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to query Tailscale status."
          }

          $status = $statusJson | ConvertFrom-
