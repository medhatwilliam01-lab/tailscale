
name: Secure RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-rdp
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Required Secrets
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Missing GitHub secret: TAILSCALE_AUTH_KEY"
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing GitHub secret: RDP_PASSWORD"
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "RDP_PASSWORD must be at least 16 characters."
          }

          Write-Host "Required secrets are configured."

      - name: Configure RDP Securely
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpBase = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp = Join-Path $rdpBase 'WinStations\RDP-Tcp'

          # Enable Remote Desktop and keep NLA enabled.
          Set-ItemProperty -Path $rdpBase `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty -Path $rdpTcp `
            -Name 'UserAuthentication' -Value 1

          # Create or update a standard local RDP user.
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existingUser = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
            New-LocalUser -Name 'RDP' `
              -Password $securePassword `
              -AccountNeverExpires `
              -Description 'Temporary RDP account' | Out-Null
          }
          else {
            Set-LocalUser -Name 'RDP' -Password $securePassword
          }

          $rdpSid = (Get-LocalUser -Name 'RDP').SID.Value

          $members = @(
            Get-LocalGroupMember -Group 'Remote Desktop Users' `
              -ErrorAction SilentlyContinue
          )

          if (-not ($members | Where-Object { $_.SID.Value -eq $rdpSid })) {
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP'
          }

          # Replace our custom rule; do not open RDP to everyone.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          $service = Get-Service -Name 'TermService'

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'TermService'
          }

          Restart-Service -Name 'TermService' -Force

          Write-Host "RDP configured. NLA remains enabled."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Official Tailscale Windows x64 MSI.
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.104.1-amd64.msi'

          # Join-Path avoids the accidental tab/backslash problem.
          $installerPath = Join-Path -Path $env:TEMP `
            -ChildPath 'tailscale.msi'

          try {
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

            if (-not (Test-Path -LiteralPath $installerPath)) {
              throw "Tailscale installer was not downloaded."
            }

            $process = Start-Process `
              -FilePath 'msiexec.exe' `
              -ArgumentList "/i `"$installerPath`" /qn /norestart" `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed. Exit code: $($process.ExitCode)"
            }

            Write-Host "Tailscale installation completed."
          }
          finally {
            Remove-Item -LiteralPath $installerPath `
              -Force -ErrorAction SilentlyContinue
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tailscaleDir = Join-Path $env:ProgramFiles 'Tailscale'
          $tailscaleExe = Join-Path $tailscaleDir 'tailscale.exe'

          if (-not (Test-Path -LiteralPath $tailscaleExe)) {
            throw "tailscale.exe was not found at the expected path."
          }

          & $tailscaleExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            --unattended `
            --timeout=2m

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect. Exit code: $LASTEXITCODE"
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
            $result = & $tailscaleExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $result) {
              $candidate = ([string]($result | Select-Object -First 1)).Trim()

              if ($candidate -match '^100\.') {
                $tsIP = $candidate
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
            throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IPv4: $tsIP"

      - name: Verify RDP Listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $listener = $null

          for ($i = 0; $i -lt 15; $i++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $listener) {
            Get-Service -Name 'TermService' |
              Format-Table Name, Status

            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP listener is active."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "===== RDP ACCESS ====="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: .\RDP"
          Write-Host "Password: use your GitHub secret RDP_PASSWORD"
          Write-Host "======================"
          Write-Host ""

          while ($true) {
            Write-Host "[$(Get-Date -Format o)] Runner active."
            Start-Sleep -Seconds 300
          }
