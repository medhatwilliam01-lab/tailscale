```yaml
name: Secure RDP via Tailscale - Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Validate configuration
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "Missing GitHub Secret: TAILSCALE_AUTH_KEY"
          }

          Write-Host "Windows runner is available."
          Write-Host "Tailscale authentication secret is configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'

          Invoke-WebRequest -Uri $url -OutFile $msi

          try {
            $process = Start-Process `
              -FilePath 'msiexec.exe' `
              -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: exit code $($process.ExitCode)"
            }

            Write-Host "Tailscale installation completed."
          }
          finally {
            Remove-Item $msi -Force -ErrorAction SilentlyContinue
          }

      - name: Connect and verify Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $exe)) {
            throw "Tailscale executable was not found."
          }

          $hostname = "gh-diagnostic-${{ github.run_id }}"

          & $exe up "--authkey=$env:TS_AUTH_KEY" "--hostname=$hostname"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed with exit code $LASTEXITCODE"
          }

          $ip = & $exe ip -4

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace(($ip -join ''))) {
            throw "Tailscale did not return an IPv4 address."
          }

          Write-Host "Tailscale connection verified."
          Write-Host "Tailscale IPv4 address: $($ip -join ', ')"
          Write-Host "No RDP credentials have been printed."
```
